networks:
  workflows-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16

services:
 nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:rw
    depends_on:
      - golang
    networks:
      workflows-network:
        ipv4_address: 172.22.0.10
    extra_hosts:
      - "projeto.localhost:172.22.0.11"
 golang:
    build:
      context: ./go
      dockerfile: Dockerfile
    container_name: golang
    ports:
      - "8080:8080"
    networks:
      workflows-network:
        ipv4_address: 172.22.0.11

 grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      workflows-network:
        ipv4_address: 172.22.0.12

 prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:rw
    networks:
      workflows-network:
        ipv4_address: 172.22.0.13
    depends_on:
      - golang
